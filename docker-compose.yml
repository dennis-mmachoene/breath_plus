# Local Postgres. Start with:  docker compose up -d
# Then:  npx prisma migrate dev --name init  &&  npm run db:seed
services:
  db:
    image: postgres:17-alpine
    container_name: breathplus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: breathplus
      POSTGRES_PASSWORD: breathplus
      POSTGRES_DB: breathplus
    ports:
      - "5432:5432"
    volumes:
      - breathplus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breathplus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  breathplus_pgdata:
